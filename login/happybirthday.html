<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>生日快樂!</title>
    <style>
        body {
            background: linear-gradient(to top, #ffccff, #ff99cc);
            text-align: center;
            font-family: "Comic Sans MS", cursive, sans-serif;
            overflow: hidden;
            height: 100vh;
        }
        h1 {
            font-size: 3rem;
            color: #ff3366;
            text-shadow: 2px 2px 5px #ff6699;
            margin-top: 20px;
        }
        .balloon {
            width: 50px;
            height: 70px;
            border-radius: 50%;
            position: absolute;
            bottom: -100px;
            animation: float 5s ease-in-out infinite;
        }
        @keyframes float {
            0% { transform: translateY(0); opacity: 1; }
            100% { transform: translateY(-800px); opacity: 0; }
        }
        .cake {
            width: 220px;
            height: 160px;
            background: linear-gradient(to bottom, #ff9966, #ff5e62);
            margin: 50px auto;
            position: relative;
            border-radius: 10px 10px 0 0;
            box-shadow: 5px 5px 10px rgba(0, 0, 0, 0.2);
        }
        .candle {
            width: 12px;
            height: 50px;
            background-color: yellow;
            position: absolute;
            top: -50px;
            left: 50%;
            transform: translateX(-50%);
            border-radius: 3px;
        }
        .flame {
            width: 18px;
            height: 25px;
            background: radial-gradient(circle, orange, red);
            border-radius: 50%;
            position: absolute;
            top: -25px;
            left: 50%;
            transform: translateX(-50%);
            animation: flicker 0.3s infinite alternate;
        }
        @keyframes flicker {
            0% { opacity: 1; transform: scale(1); }
            100% { opacity: 0.6; transform: scale(1.2); }
        }
        .cake::before {
            content: "";
            width: 100%;
            height: 20px;
            background: #ffcc99;
            position: absolute;
            bottom: 0;
            border-radius: 10px 10px 0 0;
        }
        .plate {
            width: 250px;
            height: 20px;
            background: #d9b38c;
            border-radius: 50%;
            margin: auto;
            position: relative;
            top: -10px;
        }
    </style>
</head>
<body>
    <h1>🎉 生日快樂！🎂</h1>
    <div class="cake">
        <div class="candle">
            <div class="flame"></div>
        </div>
    </div>
    <div class="plate"></div>
    <script>
        function createBalloon() {
            const balloon = document.createElement("div");
            balloon.className = "balloon";
            balloon.style.backgroundColor = `hsl(${Math.random() * 360}, 100%, 60%)`;
            balloon.style.left = `${Math.random() * window.innerWidth}px`;
            balloon.style.animationDuration = `${3 + Math.random() * 3}s`;
            document.body.appendChild(balloon);
            setTimeout(() => balloon.remove(), 5000);
        }
        setInterval(createBalloon, 400);
    </script>
</body>
</html>
