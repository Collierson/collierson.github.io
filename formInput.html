<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8"/>
    <title>表單填寫處 - 絨</title>
    <link rel="stylesheet" href="formInput.css" />
    <link rel="shortcut icon" href="logo.ico"/>
</head>
<body>
    <div class="information_bar">
        <button class="databutton" onclick="window.location.href='https://docs.google.com/spreadsheets/d/e/2PACX-1vTIKa3rJdUMqF7hauKgoSn-eJ41HMp8_ZH2OSMUNRtcs4wl9qVvZbjZR4ChpDhYT9bvVaQzDjsbdx6P/pubhtml'">資料查看</button>
        <button class="homebutton">注射資料系統</button>
    </div>
    <form name="myForm" class="myForm" id="myForm" method="post">
        <h1>表單填寫處</h1>
        <select class="place" multiple size="7" name="部位" id="place">
            <option value="null">請選擇注射部位：</option>
            <option value="左肩">左肩</option>
            <option value="右肩">右肩</option>
            <option value="左腿">左腿</option>
            <option value="右腿">右腿</option>
            <option value="左肚">左肚</option>
            <option value="右肚">右肚</option>
        </select>
        <div class="ExactTimeAndName">
            <span>輸入注射時間、原始血糖及施打者姓名</span>
            <input type="datetime-local" class="exactTime" id="exactTime" name="日期時間"/>
            <input type="text" class="sg" id="sg" placeholder="原始血糖" name="原始血糖"/>
            <input type="text" class="remark" id="remark" placeholder="備註" name="備註"/>
        </div>
        <button type="submit" class="Add">添加</button>
    </form>

    <script>
        const scriptURL = 'https://sheetdb.io/api/v1/eydj2kexw8ecb'
        const form = document.querySelector('#myForm')


        form.addEventListener('submit', e => {
            e.preventDefault()
            console.log(form)
            fetch(scriptURL, { 
                method: 'POST', 
                body: new FormData(form)})
                .then(response => {alert('Success!', response)})
                .catch(error => alert('Error!', error.message))
        })


    </script>
</body>
</html>
