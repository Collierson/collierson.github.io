<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8"/>
    <title>表單填寫處 - 絨</title>
    <link rel="stylesheet" href="formInput.css" />
    <link rel="shortcut icon" href="logo.ico"/>
</head>
<body>
    <div class="information_bar">
        <button class="homebutton">注射資料系統</button>
    </div>
    <form name="myForm" class="myForm" id="myForm" method="post">
        <h1>表單填寫處</h1>
        <select class="time" multiple size="5" name="時段" id="time">
            <option value="null">請選擇注射時段：</option>
            <option value="早上">早上</option>
            <option value="中午">中午</option>
            <option value="下午">下午</option>
            <option value="睡前">睡前</option>
        </select>
        <select class="count" multiple size="3" name="count" id="劑量">
            <option value="null">請選擇注射劑量：</option>
            <option value="14">14</option>
            <option value="16">16</option>
        </select>
        <select class="place" multiple size="7" name="place" id="部位">
            <option value="null">請選擇注射部位：</option>
            <option value="左肩">左肩</option>
            <option value="右肩">右肩</option>
            <option value="左腿">左腿</option>
            <option value="右腿">右腿</option>
            <option value="左肚">左肚</option>
            <option value="右肚">右肚</option>
        </select>
        <div class="ExactTimeAndName">
            <span>輸入注射日期、原始血糖及施打者姓名</span>
            <input type="date" class="exactTime" id="exactTime" name="日期"/>
            <input type="text" class="sg" id="sg" placeholder="原始血糖" name="原始血糖"/>
            <input type="text" class="name" id="name" placeholder="施打者姓名" name="施打者姓名"/>
        </div>
        <button type="submit" class="Add">添加</button>
    </form>

    <script>
        const scriptURL = 'https://sheetdb.io/api/v1/eydj2kexw8ecb'
        const form = document.querySelector('#myForm')

        form.addEventListener('submit', e => {
            e.preventDefault()
            console.log(form)
            fetch(scriptURL, { 
                method: 'POST', 
                body: new FormData(form)})
                .then(response => {alert('Success!', response)})
                .catch(error => alert('Error!', error.message))
        })


    </script>
</body>
</html>
